name: Publish crates

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to crates.io after the dry run succeeds (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crates-io
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  crates:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          metal: true

      - name: Validate publishable package metadata
        run: |
          cargo metadata --locked --no-deps --format-version 1 | jq -e '
            all(.packages[] | select(.publish != []);
              (.name == "uzu" or (.name | startswith("uzu-"))) and
              (.description | type == "string" and length > 0) and
              (.keywords | length <= 5)
            )'

      - name: Dry run crates.io publishing
        run: cargo publish --workspace --locked --dry-run

      - name: Publish to crates.io
        if: >-
          github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          : "${CARGO_REGISTRY_TOKEN:?CARGO_REGISTRY_TOKEN secret is required}"
          cargo publish --workspace --locked
